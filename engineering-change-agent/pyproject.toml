[project]
name = "change-agent"
version = "0.1.0"
description = "Stage 1A explicit agentic harness (Engineering Change Readiness Agent) — companion code for the 'Inside the Agentic Harness' article series on abhisingh.org."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.106",
    "azure-identity>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
change-agent = "change_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
